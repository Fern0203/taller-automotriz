{% load static %}<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión · Taller</title><link rel="stylesheet" href="{% static 'core/app.css' %}"></head>
<body><div class="centro"><div class="card">
  <div class="marca"><img src="{% static 'core/logo_universidad.png' %}" alt="Logo de la universidad" onerror="this.remove()">
    <div><b>{{ equipo.universidad }}</b><br><small class="muted">{{ equipo.curso }} · {{ equipo.ciclo }}</small></div></div>
  <h1>🔧 Taller Automotriz</h1><p class="muted">Sistema de órdenes de trabajo</p>
  {% if form.errors %}<div class="msg error">Usuario o contraseña incorrectos.</div>{% endif %}
  <form method="post" class="f">{% csrf_token %}
    <div><label>Usuario</label><input name="username" autofocus required></div>
    <div><label>Contraseña</label><input type="password" name="password" required></div>
    <button class="btn">Entrar</button>
  </form>
  <p style="margin-top:14px"><a href="{% url 'consulta' %}">¿Eres cliente? Consulta tu vehículo</a> · <a href="{% url 'equipo' %}">Equipo</a></p>
</div></div></body></html>
